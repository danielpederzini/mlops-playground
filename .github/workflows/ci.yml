name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        default: '50'
      hidden:
        description: Units per hidden layer, space separated
        default: '32 16'
      batch_size:
        description: Batch size
        default: '32'
      seed:
        description: Random seed
        default: '42'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r requirements.txt

      - name: Check style
        run: pycodestyle train.py test_train.py

      - name: Run tests
        run: pytest -q

  train:
    name: Train and log to DagsHub
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/${{ vars.DAGSHUB_USERNAME }}/${{ vars.DAGSHUB_REPO }}.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r requirements.txt

      - name: Verify DagsHub configuration
        run: |
          if [ -z "${{ vars.DAGSHUB_USERNAME }}" ] \
            || [ -z "${{ vars.DAGSHUB_REPO }}" ] \
            || [ -z "${{ secrets.DAGSHUB_TOKEN }}" ]; then
            echo "::error::Missing DagsHub configuration. Set the repository"
            echo "::error::variables DAGSHUB_USERNAME and DAGSHUB_REPO, and the"
            echo "::error::secret DAGSHUB_TOKEN."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "$MLFLOW_TRACKING_USERNAME:$MLFLOW_TRACKING_PASSWORD" \
            --max-time 30 \
            "$MLFLOW_TRACKING_URI/api/2.0/mlflow/experiments/search?max_results=1")
          echo "tracking server responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Cannot reach the DagsHub MLflow server (HTTP $code)."
            exit 1
          fi

      - name: Train
        timeout-minutes: 15
        run: |
          python train.py \
            --epochs "${{ inputs.epochs || '50' }}" \
            --hidden ${{ inputs.hidden || '32 16' }} \
            --batch-size "${{ inputs.batch_size || '32' }}" \
            --seed "${{ inputs.seed || '42' }}" \
            --experiment-name fetal_health \
            --run-name "ci-${{ github.run_number }}" \
            --verbose 2 \
            | tee train.log

      - name: Summarise run
        if: always()
        run: |
          {
            echo "### Training run \`ci-${{ github.run_number }}\`"
            echo
            echo '```'
            grep -E '^(run_id|test_loss|test_accuracy):' train.log || \
              echo 'no metrics produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-log-${{ github.run_number }}
          path: train.log
          if-no-files-found: warn
